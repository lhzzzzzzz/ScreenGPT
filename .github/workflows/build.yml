name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift tests
        run: swift test
      - name: Build universal app and packages
        run: ./scripts/package.sh
      - name: Verify packages and create checksums
        run: |
          codesign --verify --deep --strict dist/ScreenGPT.app
          hdiutil verify dist/ScreenGPT-macOS.dmg
          lipo -verify_arch arm64 x86_64 dist/ScreenGPT.app/Contents/MacOS/ScreenGPT
          cd dist
          shasum -a 256 ScreenGPT-macOS.dmg ScreenGPT-macOS.zip > SHA256SUMS.txt
      - name: Upload app packages
        uses: actions/upload-artifact@v4
        with:
          name: ScreenGPT-macOS
          path: |
            dist/ScreenGPT-macOS.zip
            dist/ScreenGPT-macOS.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
